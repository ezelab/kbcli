[package]
name = "kbcli-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified test + benchmark crate for kbcli (functional, recall, performance)."
publish = false

[dependencies]
kbcli-core.workspace = true
kbcli-embed.workspace = true
kbcli-store.workspace = true
kbcli-embed-llama.workspace  = true
kbcli-store-sqlite.workspace = true

anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true

# Used by the BEIR/SciFact bench (gated on `model-llama`) to download the
# canonical BEIR zip distribution and extract corpus/queries/qrels. Optional
# so the default test build stays offline and slim.
reqwest     = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
zip         = { version = "0.6", default-features = false, features = ["deflate"], optional = true }

[features]
default = []
# Enables real EmbeddingGemma via llama-cpp + Metal. Required for the
# BEIR/SciFact retrieval-quality bench.
model-llama = ["kbcli-embed-llama/model", "dep:reqwest", "dep:zip"]

[[bin]]
name = "run_runtime_bench"
path = "bin/run_runtime_bench.rs"

[[bin]]
name = "run_storage_bench"
path = "bin/run_storage_bench.rs"

[[bin]]
name = "run_e2e_bench"
path = "bin/run_e2e_bench.rs"

[[bin]]
name = "run_search_bench"
path = "bin/run_search_bench.rs"
required-features = ["model-llama"]
