[package]
name = "kbcli-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kbcli command-line interface."

[[bin]]
name = "kbcli"
path = "src/main.rs"

[dependencies]
kbcli-core.workspace = true
kbcli-embed.workspace = true
kbcli-store.workspace = true
kbcli-embed-llama.workspace  = true
kbcli-store-sqlite.workspace = true

anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
walkdir.workspace = true
dirs.workspace = true
unicode-segmentation.workspace = true

[features]
# Default build is offline & fast: ships the deterministic `hash` runtime
# plus the `sqlite-vec` storage backend. Enable `model-llama` to compile
# in real EmbeddingGemma inference (requires cmake + downloads weights on
# first use).
default = []
model-llama = ["kbcli-embed-llama/model"]
