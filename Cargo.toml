[workspace]
resolver = "2"
members = [
    "crates/kbcli-core",
    "crates/kbcli-embed",
    "crates/kbcli-store",
    "crates/kbcli-embed-llama",
    "crates/kbcli-store-sqlite",
    "crates/kbcli-cli",
    "crates/kbcli-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ezelab/kbcli"
rust-version = "1.75"

[workspace.dependencies]
# Workspace-internal crates
kbcli-core         = { path = "crates/kbcli-core" }
kbcli-embed        = { path = "crates/kbcli-embed" }
kbcli-store        = { path = "crates/kbcli-store" }
kbcli-embed-llama  = { path = "crates/kbcli-embed-llama" }
kbcli-store-sqlite = { path = "crates/kbcli-store-sqlite" }

# Common deps
anyhow      = "1"
thiserror   = "1"
async-trait = "0.1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap        = { version = "4", features = ["derive", "env"] }
uuid        = { version = "1", features = ["v7", "serde"] }
hex         = "0.4"
sha2        = "0.10"
walkdir     = "2"
dirs        = "5"
rand        = "0.8"
rand_chacha = "0.3"
tempfile    = "3"
unicode-segmentation = "1"

# Storage
rusqlite        = { version = "0.31", features = ["bundled", "blob"] }
sqlite-vec      = "0.1"
zerocopy        = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
