name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build (release)
        shell: bash
        run: |
          cargo build --release \
            --bin kbcli \
            -p kbcli-cli \
            --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/kbcli.exe dist/kbcli-${{ matrix.target }}.exe
            (cd dist && 7z a kbcli-${{ matrix.target }}.zip kbcli-${{ matrix.target }}.exe)
          else
            cp target/${{ matrix.target }}/release/kbcli dist/kbcli-${{ matrix.target }}
            chmod +x dist/kbcli-${{ matrix.target }}
            tar -C dist -czf dist/kbcli-${{ matrix.target }}.tar.gz kbcli-${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kbcli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: list
        run: ls -lR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
